{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Release.Name }}
spec:
  {{- with .Values.route.host }}
  host: {{ . | quote }}
  {{- end }}
  path: {{ .Values.route.path }}
  to:
    kind: Service
    name: {{ .Release.Name }}-web
    weight: 100
  port:
    targetPort: 8080
  wildcardPolicy: None
  {{- if .Values.route.tls }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
{{- end }}
