{{- $external := or .Values.database.url .Values.database.existingSecret }}
{{- if and .Values.postgres.enabled $external }}
{{- fail "use either postgres.enabled or database.url/database.existingSecret, not both" }}
{{- end }}
{{- if and (gt (int .Values.api.replicas) 1) (not .Values.postgres.enabled) (not $external) }}
{{- fail "api.replicas must be 1 without a database: the API keeps users in memory" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
          {{- if .Values.postgres.enabled }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: password
            - name: DATABASE_URL
              value: postgres://mono:$(PGPASSWORD)@{{ .Release.Name }}-postgres:5432/mono
          {{- else if $external }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret | default (printf "%s-database" .Release.Name) }}
                  key: url
          {{- end }}
          ports:
            - containerPort: 3000
          # The API listens only after its store is ready, so a rollout waits for Postgres.
          readinessProbe:
            tcpSocket:
              port: 3000
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - port: 3000
