api:
  image:
    repository: ghcr.io/kobbikobb/mono/api
    tag: latest
  replicas: 1

web:
  image:
    repository: ghcr.io/kobbikobb/mono/web
    tag: latest
  replicas: 1

# On OpenShift an Ingress is converted to a Route automatically.
ingress:
  enabled: false
  className: ""
  host: ""
  tls: false

# Optional PostgreSQL, from quay.io because the Docker Hub image can't run under OpenShift's random UID.
postgres:
  enabled: false
  image:
    repository: quay.io/sclorg/postgresql-16-c9s
    tag: "20261027"
  storage: 1Gi

# Use your own PostgreSQL instead of postgres.enabled. Set one of:
#   url:            a connection string, e.g. postgres://user:pass@host:5432/db (stored in a Secret)
#   existingSecret: name of a Secret that has the connection string under the key "url"
database:
  url: ""
  existingSecret: ""
