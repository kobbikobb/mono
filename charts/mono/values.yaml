api:
  image:
    repository: ghcr.io/kobbikobb/mono/api
    tag: latest
  replicas: 1

web:
  image:
    repository: ghcr.io/kobbikobb/mono/web
    tag: latest
  replicas: 1

# Enable exactly one of ingress or route.
# Full OpenShift converts an Ingress to a Route, but MicroShift does not, so use
# route on MicroShift.
ingress:
  enabled: false
  className: ""
  host: ""
  tls: false

# Demo only: a single PostgreSQL pod with no backups or failover. Image is from quay.io because the
# Docker Hub image can't run under OpenShift's random UID.
postgres:
  enabled: false
  image:
    repository: quay.io/sclorg/postgresql-16-c9s
    tag: "20261027"
  storage: 1Gi

# Use your own PostgreSQL instead of postgres.enabled. Set one of:
#   url:            a connection string, e.g. postgres://user:pass@host:5432/db (stored in a Secret)
#   existingSecret: name of a Secret that has the connection string under the key "url"
database:
  url: ""
  existingSecret: ""

route:
  enabled: false
  host: ""
  tls: false
