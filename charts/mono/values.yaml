api:
  image:
    repository: ghcr.io/kobbikobb/mono/api
    tag: latest
  replicas: 1

web:
  image:
    repository: ghcr.io/kobbikobb/mono/web
    tag: latest
  replicas: 1

# On OpenShift an Ingress is converted to a Route automatically.
ingress:
  enabled: false
  className: ""
  host: ""

# Optional PostgreSQL. The image is built for arbitrary UIDs, as OpenShift assigns.
postgres:
  enabled: false
  image:
    repository: quay.io/sclorg/postgresql-16-c9s
    tag: latest
  storage: 1Gi
