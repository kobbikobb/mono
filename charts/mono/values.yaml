api:
  image:
    repository: ghcr.io/kobbikobb/mono/api
    tag: latest
  replicas: 1

web:
  image:
    repository: ghcr.io/kobbikobb/mono/web
    tag: latest
  replicas: 1

# On OpenShift an Ingress is converted to a Route automatically.
ingress:
  enabled: false
  className: ""
  host: ""
  tls: false

# Demo only: a single PostgreSQL pod with no backups or failover. For real use, provision a database
# yourself and set database.url or database.existingSecret. Image is from quay.io because the Docker Hub
# image can't run under OpenShift's random UID.
postgres:
  enabled: false
  image:
    repository: quay.io/sclorg/postgresql-16-c9s
    tag: "20261027"
  storage: 1Gi
