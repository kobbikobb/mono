api:
  image:
    repository: ghcr.io/kobbikobb/mono/api
    tag: latest
  replicas: 1

web:
  image:
    repository: ghcr.io/kobbikobb/mono/web
    tag: latest
  replicas: 1

# On OpenShift an Ingress is converted to a Route automatically.
ingress:
  enabled: false
  className: ""
  host: ""

# Optional PostgreSQL. Uses Red Hat's image from quay.io instead of Docker Hub's: it runs
# under the random UID OpenShift assigns (the official image expects a fixed user) and quay.io
# does not rate-limit pulls from shared clusters.
postgres:
  enabled: false
  image:
    repository: quay.io/sclorg/postgresql-16-c9s
    tag: latest
  storage: 1Gi
