name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 0.1.0-rc.1)
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mono-api
  CHART_DIR: charts/mono-api

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: latest
      - run: helm lint "$CHART_DIR"
      - run: helm template mono "$CHART_DIR" --set ingress.enabled=true >/dev/null
      - run: helm template mono "$CHART_DIR" --set route.enabled=true >/dev/null
      - run: bash -n scripts/*.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: false

  publish:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          version=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          fi

          tags="${IMAGE}:sha-${GITHUB_SHA::7}"
          if [[ -n "$version" ]]; then
            tags="${tags},${IMAGE}:${version}"
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              tags="${tags},${IMAGE}:latest"
            fi
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags="${tags},${IMAGE}:edge"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - if: steps.meta.outputs.version != ''
        uses: azure/setup-helm@v4
        with:
          version: latest
      - if: steps.meta.outputs.version != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package "$CHART_DIR" \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.meta.outputs.version }}" \
            --destination dist
          helm push "dist/mono-api-${{ steps.meta.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"
