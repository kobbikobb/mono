name: Publish images and chart

on:
  push:
    branches: [main]

# Runs one at a time so `latest` follows main. Accepted: if pushes queue up,
# only the newest pending run is kept, so an intermediate commit may get no image.
concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The run number gives every merge a unique, increasing chart version.
      - run: helm package charts/mono --version "0.1.${{ github.run_number }}" --app-version "${{ github.sha }}"
      - run: helm push mono-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
