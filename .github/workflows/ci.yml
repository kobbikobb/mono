name: CI

on: pull_request

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: api
      - run: npm run lint
        working-directory: api

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint charts/mono
      - run: helm template mono charts/mono --set ingress.enabled=true,postgres.enabled=true > /dev/null
      - run: helm template mono charts/mono --set database.url=postgres://u:p@h/d,api.replicas=2 > /dev/null
      - run: helm template mono charts/mono --set database.existingSecret=mine > /dev/null

  e2e-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
          config: .github/kind.yaml
      - run: |
          docker build -t mono-api:ci api
          docker build -t mono-web:ci web
          kind load docker-image mono-api:ci mono-web:ci
      - run: |
          kubectl apply -f https://kind.sigs.k8s.io/examples/ingress/deploy-ingress-nginx.yaml
          kubectl wait -n ingress-nginx --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=120s
          # The pod can be ready before the admission webhook accepts connections.
          kubectl wait -n ingress-nginx --for=jsonpath='{.subsets[0].addresses[0].ip}' endpoints/ingress-nginx-controller-admission --timeout=60s
      # Mimic OpenShift's restricted SCC: enforce the restricted Pod Security level.
      - run: |
          kubectl create namespace mono
          kubectl label namespace mono pod-security.kubernetes.io/enforce=restricted
      - run: >
          helm install mono charts/mono -n mono --wait --timeout 120s
          --set api.image.repository=mono-api,api.image.tag=ci
          --set web.image.repository=mono-web,web.image.tag=ci
          --set ingress.enabled=true,ingress.className=nginx
          --set postgres.enabled=true
      - run: kubectl -n mono exec deploy/mono-postgres -- psql -U mono -c 'select 1'
      - name: Only the API can reach Postgres
        run: |
          # Positive control: the probe works from the web pod, so a failure below is the policy.
          kubectl -n mono exec deploy/mono-web -- nc -zw3 mono-api 3000
          if kubectl -n mono exec deploy/mono-web -- nc -zw3 mono-postgres 5432; then
            echo "web can reach postgres" && exit 1
          fi
      # OpenShift runs containers with an arbitrary UID; the images must not depend on a fixed one.
      - run: |
          for d in api web; do
            kubectl -n mono patch deployment mono-$d --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/securityContext/runAsUser","value":1000650000}]'
            kubectl -n mono rollout status deployment/mono-$d --timeout=120s
          done
      - run: |
          timeout 30 sh -c 'until curl -sf localhost:8080/api/users; do sleep 1; done'
      - name: Users survive an API restart
        run: |
          curl -sf -X POST -H 'content-type: application/json' -d '{"name":"persisted"}' localhost:8080/api/users
          kubectl -n mono rollout restart deployment/mono-api
          kubectl -n mono rollout status deployment/mono-api --timeout=120s
          timeout 30 sh -c 'until curl -sf localhost:8080/api/users | grep persisted; do sleep 1; done'
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
