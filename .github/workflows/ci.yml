name: CI

on: pull_request

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: api
      - run: npm run lint
        working-directory: api

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: helm lint charts/mono
      - run: helm template mono charts/mono --set ingress.enabled=true > /dev/null

  e2e-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: helm/kind-action@v1
      - run: |
          docker build -t mono-api:ci api
          docker build -t mono-web:ci web
          kind load docker-image mono-api:ci mono-web:ci
      - run: >
          helm install mono charts/mono --wait --timeout 120s
          --set api.image.repository=mono-api,api.image.tag=ci
          --set web.image.repository=mono-web,web.image.tag=ci
      - run: |
          kubectl port-forward svc/mono-web 8080:8080 &
          timeout 30 sh -c 'until curl -sf localhost:8080/api/users; do sleep 1; done'
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
