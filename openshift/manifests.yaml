apiVersion: v1
kind: Namespace
metadata:
  name: mono
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mono
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: localhost/users-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/users
              port: 3000
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mono
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api
  namespace: mono
spec:
  to:
    kind: Service
    name: api
  port:
    targetPort: 3000
